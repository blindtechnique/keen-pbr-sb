        run: |
          cd release-assets
          sha256sum keen-pbr_*.ipk > SHA256SUMS

      - name: Sign next manifest and installer
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          KEENETIC_RELEASE_SIGNING_KEY: ${{ secrets.KEENETIC_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ -z "${KEENETIC_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::KEENETIC_RELEASE_SIGNING_KEY is not configured; signed artifact was not uploaded."
            exit 1
          fi
          signing_key=$(mktemp "$RUNNER_TEMP/keenetic-release-key.XXXXXX")
          trap 'rm -f -- "$signing_key"' EXIT
          printf '%s\n' "$KEENETIC_RELEASE_SIGNING_KEY" > "$signing_key"
          unset KEENETIC_RELEASE_SIGNING_KEY
          python3 .release-signing-tools/build_scripts/embed-release-verifier.py \
            --installer install.sh \
            --verifier .release-signing-tools/packages/keenetic/keen-pbr/files/opt/usr/lib/keen-pbr/release-verify.sh \
            --public-key .release-signing-tools/packages/keys/keenetic-release-public.pem --check
          python3 .release-signing-tools/build_scripts/sign-keenetic-release.py \
            --assets release-assets --installer install.sh \
            --key "$signing_key" \
            --public-key .release-signing-tools/packages/keys/keenetic-release-public.pem \
            --repository "$GITHUB_REPOSITORY" --channel next \
            --release "next-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source "$SOURCE_SHA" \
            --build "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: keen-pbr-ipk
          path: |
            release-assets/keen-pbr_*.ipk
            release-assets/SHA256SUMS
            release-assets/install.sh
            release-assets/release-manifest.tsv
            release-assets/release-manifest.sig
          if-no-files-found: error

