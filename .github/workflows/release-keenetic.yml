name: Release Keenetic IPK

on:
  push:
    tags:
      - "v*"
    # Alpha and next produce an aarch64 test IPK. Main builds an all-profile
    # Beta prerelease; promotion to Latest separately reuses its signed assets.
    branches:
      - alpha
      - main
      - next
  pull_request:
    branches:
      - alpha
      - main
      - next
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Compatible tag to build a new Pre-release (for example v3.3.0-sb.12; published assets are not replaced)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release: ${{ steps.resolve.outputs.release }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      channel: ${{ steps.resolve.outputs.channel }}
      build_matrix: ${{ steps.resolve.outputs.build_matrix }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve immutable build source
        id: resolve
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 build_scripts/resolve-release-source.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --release-tag="$REQUESTED_RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT"

      - name: Test release source selection and workflow wiring
        run: >-
          python3 -m unittest
          build_scripts.tests.test_update_release_pin
          build_scripts.tests.test_keenetic_release_signatures
          build_scripts.tests.test_signed_update_integration
          build_scripts.tests.test_resolve_release_source
          build_scripts.tests.test_release_workflow -v

  frontend:
    needs: resolve-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node for backend API code generation
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build frontend
        run: |
          git diff --check
          KEEN_PBR_RELEASE_OVERRIDE="$(bash build_scripts/resolve-version.sh release "$PWD")"
          export KEEN_PBR_RELEASE_OVERRIDE
          cd frontend
          bun install --frozen-lockfile
          make -C .. generate-check
          bun run lint
          bun run api:check
          bun run i18n:check
          bun run literals:check
          bun test
          bun run typecheck
          cd ..
          sh build_scripts/build-frontend.sh "$PWD" "$PWD/frontend/dist"

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          include-hidden-files: true

  backend:
    needs: resolve-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Install native build dependencies
        run: |
          sh build_scripts/ci-install-ubuntu-deps.sh \
            libcurl4-openssl-dev \
            libnl-3-dev \
            libnl-route-3-dev \
            libunwind-dev \
            busybox-static \
            lua5.3 \
            pkg-config \
            zlib1g-dev

      - name: Run deterministic source and package gates
        run: >-
          make check-shell check-openapi-parity check-nfqws-assets
          check-nfqws-rotator-lua

      - name: Build and run backend test matrix
        # Includes the monolithic suite, crash smoke test and all eight narrow
        # lifecycle/DNS/backup/update-lock targets. The Keenetic cross-build
        # below remains the GCC 8.4 production-binary check.
        run: >-
          make test BUILD_JOBS=4
          TEST_CMAKE_FLAGS="-DKEEN_PBR_USE_LIBUNWIND=ON -DCMAKE_BUILD_TYPE=Release"

      - name: Run IPK validator unit tests
        run: python3 -m unittest build_scripts.tests.test_validate_keenetic_ipk -v

      - name: Run Keenetic BusyBox package-script smoke tests
        run: |
          for variant in full headless; do
            docker run --rm \
              -e KEEN_PBR_PACKAGE_IT_CONTAINER=1 \
              -v "$PWD:/workspace:ro" \
              busybox:1.37 \
              sh /workspace/tests/package_it/run-postinst-target-shell.sh \
                /workspace "$variant"
          done
          docker run --rm \
            -e KEEN_PBR_PACKAGE_IT_CONTAINER=1 \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-uninstall-target-shell.sh \
              /workspace
          docker run --rm \
            -e KEEN_PBR_PACKAGE_IT_CONTAINER=1 \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-rescue-guard-lock.sh \
              /workspace
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-dnsmasq-helper-lkg.sh \
              /workspace/packages/keenetic/keen-pbr/files/opt/usr/lib/keen-pbr/dnsmasq.sh \
              /workspace/packages/openwrt/keen-pbr/files/usr/lib/keen-pbr/dnsmasq.sh \
              /workspace/packages/debian/files/usr/lib/keen-pbr/dnsmasq.sh
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-netfilter-hook-signals.sh \
              /workspace/packages/keenetic/keen-pbr/files/opt/etc/ndm/netfilter.d/50-keen-pbr-routing.sh \
              /workspace/packages/keenetic/keen-pbr/files/opt/etc/init.d/S80keen-pbr \
              /workspace/packages/keenetic/keen-pbr/files/opt/usr/lib/keen-pbr/rescue-startup-guard.sh \
              /workspace/packages/openwrt/keen-pbr/files/etc/init.d/keen-pbr \
              /workspace/packages/openwrt/keen-pbr/files/usr/lib/keen-pbr/firewall.sh \
              /workspace/packages/openwrt/keen-pbr/files/etc/hotplug.d/firewall/70-keen-pbr
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-keenetic-iptables-wait.sh \
              /workspace/packages/keenetic/keen-pbr/files/opt/etc/init.d/S80keen-pbr
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-keenetic-startup-dependencies.sh \
              /workspace/packages/keenetic/keen-pbr/files/opt/etc/init.d/S80keen-pbr
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-keenetic-meta-udp443-cleanup.sh \
              /workspace/packages/keenetic/keen-pbr/files/opt/etc/init.d/S80keen-pbr
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-keenetic-ppe-deoffload-cleanup.sh \
              /workspace/packages/keenetic/keen-pbr/files/opt/etc/init.d/S80keen-pbr
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-ndmc-env-contract.sh \
              /workspace/install.sh \
              /workspace/uninstall.sh

  crash-diagnostics-smoke:
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Install native build dependencies
        run: |
          sh build_scripts/ci-install-ubuntu-deps.sh \
            libcurl4-openssl-dev \
            libnl-3-dev \
            libnl-route-3-dev \
            libunwind-dev \
            pkg-config \
            zlib1g-dev

      - name: Configure crash diagnostics smoke test
        run: |
          cmake -S . -B build-crash-smoke \
            -DBUILD_TESTS=ON \
            -DWITH_API=OFF \
            -DKEEN_PBR_USE_LIBUNWIND=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build crash diagnostics smoke test
        run: >-
          cmake --build build-crash-smoke
          --target crash-diagnostics-smoke
          --parallel 4

      - name: Run crash diagnostics smoke test
        run: ./build-crash-smoke/tests/crash-diagnostics-smoke

  clang-thread-safety:
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Install Clang build dependencies
        run: |
          sh build_scripts/ci-install-ubuntu-deps.sh \
            clang \
            libcurl4-openssl-dev \
            libnl-3-dev \
            libnl-route-3-dev \
            libunwind-dev \
            pkg-config \
            zlib1g-dev

      - name: Run production Clang thread-safety checks for alpha
        if: github.event_name == 'push' && needs.resolve-source.outputs.channel == 'alpha'
        run: make clang-check-production BUILD_JOBS=4

      - name: Run full Clang thread-safety checks
        if: github.event_name != 'push' || needs.resolve-source.outputs.channel != 'alpha'
        run: make clang-check BUILD_JOBS=4

  firewall-integration:
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Run Docker and network namespace integration suite
        run: make firewall-it

  build:
    needs:
      - resolve-source
      - frontend
      - transport-manager
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-source.outputs.build_matrix) }}
    env:
      KEENETIC_VERSION: "3.10"
      SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          # Keep workflow artifacts outside the checkout. Build identity treats
          # every untracked source-tree path as a deliberate dirty build.
          path: ${{ runner.temp }}/frontend-dist

      - name: Stage frontend bundle
        run: |
          rm -rf frontend/dist
          mkdir -p frontend/dist
          cp -a "$RUNNER_TEMP/frontend-dist/." frontend/dist/

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          # This module currently uses only the Go standard library, so there
          # is no go.sum to cache.
          cache: false

      - name: Build ${{ matrix.config }} IPK
        env:
          KEENETIC_CONFIG: ${{ matrix.config }}
        run: |
          KEEN_PBR_RELEASE_OVERRIDE="$(bash build_scripts/resolve-version.sh release "$PWD")"
          export KEEN_PBR_RELEASE_OVERRIDE
          echo "Building release $KEEN_PBR_RELEASE_OVERRIDE for $KEENETIC_CONFIG"
          make keenetic-packages \
            KEENETIC_CONFIG="$KEENETIC_CONFIG" \
            KEENETIC_VERSION="$KEENETIC_VERSION" \
            KEENETIC_BUILD_JOBS=4

      - name: Collect and validate ${{ matrix.config }} IPK
        run: |
          set -e
          IPK=$(find build/packages -name 'keen-pbr_*.ipk' | head -1)
          test -n "$IPK"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          EXPECTED_COMMIT=$(git rev-parse --short=12 "$SOURCE_SHA")
          cp "$IPK" .
          IPK_NAME=$(basename "$IPK")
          python3 build_scripts/validate-keenetic-ipk.py "$IPK_NAME" \
            --arch "${{ matrix.arch }}" \
            --expected-commit "$EXPECTED_COMMIT"

      - name: Test packaged maintainer-script lifecycle
        run: |
          IPK_NAME=$(find . -maxdepth 1 -name 'keen-pbr_*.ipk' | head -1)
          test -n "$IPK_NAME"
          docker run --rm \
            -e KEEN_PBR_PACKAGE_IT_CONTAINER=1 \
            -v "$PWD:/workspace:ro" \
            busybox:1.37 \
            sh /workspace/tests/package_it/run-built-ipk-lifecycle.sh \
              "/workspace/${IPK_NAME#./}"

      - name: Upload ${{ matrix.config }} IPK
        uses: actions/upload-artifact@v7
        with:
          name: keenetic-ipk-${{ matrix.config }}
          path: keen-pbr_*.ipk
          if-no-files-found: error

  transport-manager:
    needs: resolve-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: Test transport manager
        working-directory: extensions/transport-manager
        run: go test ./...

      - name: Vet transport manager
        working-directory: extensions/transport-manager
        run: go vet ./...

  publish-release:
    if: github.repository == 'blindtechnique/keen-pbr-sb' && github.event_name != 'pull_request' && needs.resolve-source.outputs.release == 'true'
    needs:
      - resolve-source
      - build
      - backend
      - crash-diagnostics-smoke
      - clang-thread-safety
      - firewall-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-source.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Checkout reviewed release signing tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-signing-tools
          sparse-checkout: |
            build_scripts
            packages/keys
            packages/keenetic/keen-pbr/files/opt/usr/lib/keen-pbr
          persist-credentials: false

      - name: Download all Keenetic IPKs
        uses: actions/download-artifact@v8
        with:
          pattern: keenetic-ipk-*
          path: release-assets
          merge-multiple: true

      - name: Verify release tag and all IPKs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          EXPECTED_COMMIT=$(git rev-parse --short=12 "$SOURCE_SHA")
          test "$(find release-assets -maxdepth 1 -name 'keen-pbr_*.ipk' | wc -l)" -eq 3
          for config in aarch64-3.10 mips-3.4 mipsel-3.4; do
            arch="${config%%-*}"
            set -- release-assets/keen-pbr_*_keenetic_"$config".ipk
            test "$#" -eq 1
            test -f "$1"
            python3 build_scripts/validate-keenetic-ipk.py "$1" \
              --arch "$arch" --expected-commit "$EXPECTED_COMMIT"
          done

      - name: Create checksums
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -name 'keen-pbr_*.ipk' | wc -l)" -eq 3
          sha256sum keen-pbr_*.ipk > SHA256SUMS
          cat SHA256SUMS

      - name: Sign release manifest and installer
        env:
          KEENETIC_RELEASE_SIGNING_KEY: ${{ secrets.KEENETIC_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${KEENETIC_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::KEENETIC_RELEASE_SIGNING_KEY is not configured; no release assets were changed."
            exit 1
          fi
          signing_key=$(mktemp "$RUNNER_TEMP/keenetic-release-key.XXXXXX")
          trap 'rm -f -- "$signing_key"' EXIT
          printf '%s\n' "$KEENETIC_RELEASE_SIGNING_KEY" > "$signing_key"
          unset KEENETIC_RELEASE_SIGNING_KEY
          # Historical installers require the reviewed verification backport;
          # never combine a newer installer with an older package.
          python3 .release-signing-tools/build_scripts/embed-release-verifier.py \
            --installer install.sh \
            --verifier .release-signing-tools/packages/keenetic/keen-pbr/files/opt/usr/lib/keen-pbr/release-verify.sh \
            --public-key .release-signing-tools/packages/keys/keenetic-release-public.pem --check
          python3 .release-signing-tools/build_scripts/sign-keenetic-release.py \
            --assets release-assets --installer install.sh \
            --key "$signing_key" \
            --public-key .release-signing-tools/packages/keys/keenetic-release-public.pem \
            --repository "$GITHUB_REPOSITORY" --channel stable \
            --release "$RELEASE_TAG" --source "$SOURCE_SHA" \
            --build "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${RELEASE_TAG#v}"
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > RELEASE_BODY.md
          if ! [ -s RELEASE_BODY.md ]; then
            echo "Автоматическая сборка $RELEASE_TAG. Подробности в CHANGELOG.md." > RELEASE_BODY.md
          fi
          cat RELEASE_BODY.md

      - name: Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Create only: a rerun must never replace assets or downgrade a
          # release that has already been promoted to Latest.
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --verify-tag --prerelease --latest=false \
            --title "keen-pbr-sb $RELEASE_TAG — Beta" --notes-file RELEASE_BODY.md \
            release-assets/keen-pbr_*.ipk release-assets/SHA256SUMS \
            release-assets/install.sh release-assets/release-manifest.tsv \
            release-assets/release-manifest.sig

  upload-stable-candidate-artifact:
    if: github.repository == 'blindtechnique/keen-pbr-sb' && github.event_name != 'pull_request' && needs.resolve-source.outputs.candidate == 'true'
    needs:
      - resolve-source
      - build
      - backend
      - crash-diagnostics-smoke
      - clang-thread-safety
      - firewall-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-source.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Checkout reviewed release signing tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-signing-tools
          sparse-checkout: |
            build_scripts
            packages/keys
            packages/keenetic/keen-pbr/files/opt/usr/lib/keen-pbr
          persist-credentials: false

      - name: Download all candidate IPKs
        uses: actions/download-artifact@v8
        with:
          pattern: keenetic-ipk-*
          merge-multiple: true
          path: release-assets

      - name: Verify all candidate IPKs and create checksums
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          EXPECTED_COMMIT=$(git rev-parse --short=12 "$SOURCE_SHA")
          shopt -s nullglob
          packages=(release-assets/keen-pbr_*.ipk)
          test "${#packages[@]}" -eq 3
          for config in aarch64-3.10 mips-3.4 mipsel-3.4; do
            packages=(release-assets/keen-pbr_*_keenetic_${config}.ipk)
            test "${#packages[@]}" -eq 1
            python3 build_scripts/validate-keenetic-ipk.py "${packages[0]}" \
              --arch "${config%%-*}" --expected-commit "$EXPECTED_COMMIT"
          done
          cd release-assets
          sha256sum keen-pbr_*.ipk > SHA256SUMS

      - name: Sign stable candidate manifest and installer
        env:
          KEENETIC_RELEASE_SIGNING_KEY: ${{ secrets.KEENETIC_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ -z "${KEENETIC_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::KEENETIC_RELEASE_SIGNING_KEY is not configured; candidate was not signed."
            exit 1
          fi
          signing_key=$(mktemp "$RUNNER_TEMP/keenetic-release-key.XXXXXX")
          trap 'rm -f -- "$signing_key"' EXIT
          printf '%s\n' "$KEENETIC_RELEASE_SIGNING_KEY" > "$signing_key"
          unset KEENETIC_RELEASE_SIGNING_KEY
          python3 .release-signing-tools/build_scripts/embed-release-verifier.py \
            --installer install.sh \
            --verifier .release-signing-tools/packages/keenetic/keen-pbr/files/opt/usr/lib/keen-pbr/release-verify.sh \
            --public-key .release-signing-tools/packages/keys/keenetic-release-public.pem --check
          python3 .release-signing-tools/build_scripts/sign-keenetic-release.py \
            --assets release-assets --installer install.sh \
            --key "$signing_key" \
            --public-key .release-signing-tools/packages/keys/keenetic-release-public.pem \
            --repository "$GITHUB_REPOSITORY" --channel stable \
            --release "$RELEASE_TAG" --source "$SOURCE_SHA" \
            --build "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Upload stable candidate workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: keen-pbr-stable-candidate-ipk
          path: |
            release-assets/keen-pbr_*.ipk
            release-assets/SHA256SUMS
            release-assets/install.sh
            release-assets/release-manifest.tsv
            release-assets/release-manifest.sig
          if-no-files-found: error

      - name: Publish new Beta Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::notice::$RELEASE_TAG already exists and was not changed. The candidate artifact is saved; advance KEEN_PBR_RELEASE for a new release."
            exit 0
          else
            tag_status=$?
            if [ "$tag_status" -ne 2 ]; then
              echo "::error::Unable to check the release tag; no release was created."
              exit "$tag_status"
            fi
          fi
          : > BETA_NOTES.md
          if [ -f CHANGELOG.md ]; then
            awk -v heading="## [${RELEASE_TAG#v}]" '
              /^## \[/ {include = index($0, heading) == 1; next}
              include {print}
            ' CHANGELOG.md > BETA_NOTES.md
          fi
          if ! [ -s BETA_NOTES.md ]; then
            printf 'Beta build from `%s`.\n\nKeenetic profiles: aarch64-3.10, mips-3.4, mipsel-3.4.\n\nAutomatic stable updates remain unchanged until promotion. See [CHANGELOG](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$SOURCE_SHA" > BETA_NOTES.md
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "keen-pbr-sb $RELEASE_TAG — Beta" --notes-file BETA_NOTES.md \
            release-assets/keen-pbr_*.ipk release-assets/SHA256SUMS \
            release-assets/install.sh release-assets/release-manifest.tsv \
            release-assets/release-manifest.sig

  upload-next-artifact:
    if: github.repository == 'blindtechnique/keen-pbr-sb' && github.event_name != 'pull_request' && needs.resolve-source.outputs.channel == 'next'
    needs:
      - resolve-source
      - build
      - backend
      - crash-diagnostics-smoke
      - clang-thread-safety
      - firewall-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Checkout reviewed release signing tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-signing-tools
          sparse-checkout: |
            build_scripts
            packages/keys
            packages/keenetic/keen-pbr/files/opt/usr/lib/keen-pbr
          persist-credentials: false

      - name: Download aarch64 test IPK
        uses: actions/download-artifact@v8
        with:
          name: keenetic-ipk-aarch64-3.10
          path: release-assets

