# keen-pbr-sb · профиль «МАКСИМАЛЬНЫЙ»
#
# Всё из обычного плюс четыре дополнительных тира TCP (включая syndata — данные в SYN),
# фрагментация IP и подмена оригинала в QUIC. Экспериментальный: часть провайдеров и часть
# серверов на syndata реагируют разрывом. Ставьте, только если обычный не справляется.
#
# Глубина пулов: TCP 12 · QUIC 6 · UDP 4 · отдельные пулы: googlevideo, youtube, youtube-QUIC, discord, сквозной WebRTC
# Пулы разделены по группам доменов: у каждого свой circular со своим key=.
# У TCP-пулов есть inseq= под ожидаемый объём входящего трафика; UDP его не использует.
#
# Сгенерировано build-nfqws-strategies.py — правьте генератор, а не этот файл.

# Интерфейс провайдера. Панель подставляет реальный при применении.
ISP_INTERFACE="eth3"

# Полный список аргументов: https://github.com/bol-van/zapret2/blob/master/docs/manual.md

# Стартовые аргументы и объявление блобов
NFQWS_BASE_ARGS="--writable=/var/run/keen-pbr-nfqws --lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
                 --lua-init=@/opt/var/lib/keen-pbr/nfqws-rotator-telemetry-v1.lua
                 --blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin
                 --blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin
                 --blob=http_iana:@/opt/etc/nfqws2/blobs/http_iana_org.bin
                 --blob=quic_4:@/opt/etc/nfqws2/blobs/quic_initial_4.bin
                 --blob=quic_5:@/opt/etc/nfqws2/blobs/quic_initial_5.bin
                 --blob=quic_6:@/opt/etc/nfqws2/blobs/quic_initial_6.bin
                 --blob=quic_google:@/opt/etc/nfqws2/blobs/quic_initial_www_google_com.bin
                 --blob=quic_steam:@/opt/etc/nfqws2/blobs/quic_initial_steamcommunity_com.bin
                 --blob=stun_fake:@/opt/etc/nfqws2/blobs/stun.bin
                 --blob=syn_data:@/opt/etc/nfqws2/blobs/syn_packet.bin
                 --blob=tls_14:@/opt/etc/nfqws2/blobs/tls_clienthello_14.bin
                 --blob=tls_4pda:@/opt/etc/nfqws2/blobs/tls_clienthello_4pda_to.bin
                 --blob=tls_activated:@/opt/etc/nfqws2/blobs/tls_clienthello_activated.bin
                 --blob=tls_google:@/opt/etc/nfqws2/blobs/tls_clienthello_www_google_com.bin
                 --blob=tls_gosuslugi:@/opt/etc/nfqws2/blobs/tls_clienthello_gosuslugi_ru.bin
                 --blob=tls_max:@/opt/etc/nfqws2/blobs/tls_clienthello_max_ru.bin
                 --blob=tls_onetrust:@/opt/etc/nfqws2/blobs/tls_clienthello_www_onetrust_com.bin
                 --blob=tls_t2:@/opt/etc/nfqws2/blobs/tls_clienthello_t2.bin
                 --blob=tls_vk:@/opt/etc/nfqws2/blobs/tls_clienthello_vk_com.bin
                 --blob=zero256:@/opt/etc/nfqws2/blobs/zero_256.bin"

# Основной пул: HTTPS/HTTP, всё, что не попало в отдельные пулы ниже
NFQWS_ARGS="--filter-tcp=443,80,1984,2053,2083,2087,2096,5222,8443 --filter-l7=http,tls,mtproto
            --payload=tls_client_hello,mtproto_initial
            --lua-desync=circular:fails=2:time=300:retrans=3:inseq=26000:maxseq=65536:nld=2:key=tcp_general
            --lua-desync=fake:blob=tls_clienthello:optional:tls_mod=rnd,dupsid,sni=fonts.google.com:tcp_seq=10000:strategy=1
            --lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=1
            --lua-desync=fake:blob=tls_clienthello:optional:tcp_ack=-66000:tls_mod=rnd,dupsid,sni=www.google.com:tcp_ts_up:repeats=2:strategy=2
            --lua-desync=multisplit:pos=1,midsld:strategy=2
            --lua-desync=hostfakesplit:host=ozon.ru:midhost=host-2:seqovl=sniext+3:seqovl_pattern=tls_clienthello:badsum:tcp_md5:tcp_ts_up:strategy=3
            --lua-desync=hostfakesplit:tcp_md5:tcp_ts_up:strategy=3
            --lua-desync=multidisorder:pos=1,midsld:seqovl=3:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=4
            --lua-desync=fake:blob=tls_clienthello:optional:tls_mod=rnd,dupsid,sni=www.microsoft.com:tcp_seq=10000:ip_autottl=1,3-12:strategy=5
            --lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=5
            --lua-desync=multisplit:pos=2:seqovl=681:seqovl_pattern=tls_google:optional:strategy=6
            --lua-desync=fake:blob=stun_fake:optional:tcp_seq=10000:repeats=6:strategy=7
            --lua-desync=multisplit:pos=2,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up:strategy=7
            --lua-desync=fake:blob=tls_max:optional:tcp_ack=-66000:tcp_ts_up:repeats=2:strategy=8
            --lua-desync=fake:blob=tls_4pda:optional:tcp_ack=-66000:tcp_ts_up:strategy=8
            --lua-desync=multisplit:pos=2,midsld:tcp_ts_up:strategy=8
            --lua-desync=fake:blob=tls_onetrust:optional:repeats=8:badseq:badsum:badseq_increment=0:strategy=9
            --lua-desync=multisplit:pos=1:seqovl=664:seqovl_pattern=tls_onetrust:optional:strategy=9
            --lua-desync=fake:blob=tls_activated:optional:repeats=8:badseq:badsum:badseq_increment=0:strategy=10
            --lua-desync=multisplit:pos=1:seqovl=654:seqovl_pattern=tls_activated:optional:strategy=10
            --lua-desync=fake:blob=tls_vk:optional:tcp_ts=-1000:badsum:strategy=11
            --lua-desync=fake:blob=tls_14:optional:tcp_ts=-1000:badsum:strategy=11
            --lua-desync=fakeddisorder:pos=10,midsld:seqovl=336:seqovl_pattern=tls_gosuslugi:optional:strategy=11
            --lua-desync=syndata:blob=syn_data:optional:strategy=12
            --lua-desync=multisplit:pos=1,sld+1,endsld-2:seqovl=1:strategy=12 --payload=http_req
            --lua-desync=fake:blob=http_iana:optional:badsum --lua-desync=http_methodeol:badsum"

# QUIC общий
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic --payload=quic_initial
                 --lua-desync=circular:fails=2:time=300:udp_in=1:udp_out=4:nld=2:key=quic_general
                 --lua-desync=fake:blob=quic_initial:repeats=11:strategy=1
                 --lua-desync=fake:blob=quic_initial:repeats=6:ip_ttl=8:strategy=2
                 --lua-desync=fake:blob=quic_google:optional:repeats=8:strategy=3
                 --lua-desync=fake:blob=quic_5:optional:repeats=4:out_range=-n3:strategy=4
                 --lua-desync=send:ipfrag:ipfrag_pos_udp=8:out_range=-n3:strategy=4
                 --lua-desync=drop:out_range=-n3:strategy=4 --lua-desync=udplen:increment=4:strategy=5
                 --lua-desync=fake:blob=quic_4:optional:repeats=2:out_range=-n3:strategy=5
                 --lua-desync=udplen:increment=8:pattern=0xFEA82025:strategy=6
                 --lua-desync=fake:blob=quic_6:optional:repeats=2:out_range=-n4:strategy=6"

# UDP общий: WireGuard, STUN, Discord, MTProto (списки к нему не применяются)
NFQWS_ARGS_UDP="--filter-udp=590-600,1400,3478-3481,5349,19294-19344,49152-65535
                --filter-l7=wireguard,stun,discord,mtproto --out-range=<n2
                --payload=wireguard_initiation,wireguard_response,wireguard_cookie,stun,discord_ip_discovery,mtproto_initial
                --lua-desync=circular:fails=2:time=300:udp_in=1:udp_out=4:nld=2:key=udp_general
                --lua-desync=fake:blob=quic_initial:repeats=6:strategy=1
                --lua-desync=fake:blob=quic_initial:repeats=6:ip_ttl=8:strategy=2
                --lua-desync=fake:blob=quic_5:optional:repeats=6:strategy=3
                --lua-desync=fake:blob=quic_steam:optional:repeats=8:strategy=4"

# Отдельные пулы. Собираются ПЕРЕД основными, поэтому матчатся первыми.
# Списки режимов (user.list/auto.list) сюда не подставляются — у каждого
# пула свой --hostlist-domains, но общий exclude.list уважается.
NFQWS_ARGS_CUSTOM="--filter-tcp=443,80,1984,2053,2083,2087,2096,5222,8443 --filter-l7=tls
                   --hostlist-domains=googlevideo.com,gvt1.com,gvt2.com
                   --hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list --payload=tls_client_hello
                   --lua-desync=circular:fails=2:time=300:retrans=2:inseq=24000:maxseq=65536:nld=2:key=gv_tcp
                   --lua-desync=multisplit:pos=1,sniext+1:seqovl=1:strategy=1
                   --lua-desync=fake:blob=tls_google:optional:repeats=6:tcp_ts=-1000:badsum:strategy=2
                   --lua-desync=multisplit:pos=1:seqovl=681:seqovl_pattern=tls_google:optional:strategy=2
                   --lua-desync=fake:blob=tls_google:optional:repeats=6:tcp_ts=-1000:badsum:ip_id=zero:strategy=3
                   --lua-desync=pktmod:ip_autottl=-2,3-20:strategy=4
                   --lua-desync=fake:blob=tls_google:optional:tcp_ts=-1000:badsum:tls_mod=rnd,dupsid,sni=fonts.google.com:strategy=5
                   --lua-desync=fakedsplit:pos=1:strategy=5 --new=yt_tcp
                   --filter-tcp=443,80,1984,2053,2083,2087,2096,5222,8443 --filter-l7=tls
                   --hostlist-domains=youtube.com,youtu.be,ytimg.com,ggpht.com,youtubei.googleapis.com,jnn-pa.googleapis.com,yt-video-upload.l.google.com
                   --hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list --payload=tls_client_hello
                   --lua-desync=circular:fails=2:time=300:retrans=2:inseq=18000:maxseq=65536:nld=2:key=yt_tcp
                   --lua-desync=multisplit:pos=1,sniext+1:seqovl=1:strategy=1
                   --lua-desync=fake:blob=tls_google:optional:repeats=6:tcp_ts=-1000:badsum:ip_id=zero:strategy=2
                   --lua-desync=multisplit:pos=1:seqovl=681:seqovl_pattern=tls_google:optional:strategy=2
                   --lua-desync=fake:blob=tls_google:optional:tls_mod=rnd,dupsid,sni=ggpht.com:badsum:badseq:strategy=3
                   --lua-desync=multisplit:pos=2,sld:seqovl=620:seqovl_pattern=tls_google:optional:strategy=3
                   --lua-desync=fake:blob=tls_onetrust:optional:repeats=8:badseq:badsum:strategy=4
                   --lua-desync=multisplit:pos=1:seqovl=664:seqovl_pattern=tls_onetrust:optional:strategy=4
                   --lua-desync=fake:blob=tls_clienthello:optional:tls_mod=rnd,dupsid,sni=www.google.com:badsum:strategy=5
                   --lua-desync=multidisorder:pos=1,midsld:strategy=5
                   --lua-desync=fake:blob=tls_t2:optional:tcp_ts=-1000:badsum:tls_mod=rnd,dupsid,sni=fonts.google.com:strategy=6
                   --lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:strategy=6
                   --new=yt_quic --filter-udp=443 --filter-l7=quic
                   --hostlist-domains=youtube.com,youtu.be,ytimg.com,ggpht.com,youtubei.googleapis.com,jnn-pa.googleapis.com,yt-video-upload.l.google.com,googlevideo.com,gvt1.com,gvt2.com
                   --hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list --payload=quic_initial
                   --lua-desync=circular:fails=2:time=300:udp_in=1:udp_out=4:nld=2:key=yt_quic
                   --lua-desync=fake:blob=quic_google:optional:repeats=11:strategy=1
                   --lua-desync=fake:blob=quic_google:optional:repeats=8:strategy=2
                   --lua-desync=fake:blob=quic_google:optional:repeats=6:strategy=3
