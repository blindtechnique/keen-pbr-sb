# keen-pbr-sb · профиль «МАКСИМАЛЬНЫЙ»
#
# Всё из обычного плюс четыре дополнительных тира TCP, фрагментация IP и подмена оригинала
# в QUIC. Последний TCP-вариант пробует syndata только на первом SYN к HTTPS/443;
# повторные неудачи учитываются для перехода к следующему варианту в новом соединении. Для
# Discord — отдельные TCP-пулы и два UDP-кандидата для начала соединения.
# Экспериментальный: syndata может не поддерживаться по пути, а кэш имён для SYN не
# различает домены на общем IP. Ставьте, только если обычный не справляется.
#
# Глубина пулов: TCP 12 · QUIC 6 · UDP 4 · IP-ветвь MTProto · отдельные пулы: googlevideo, youtube, youtube-QUIC, discord, сквозной WebRTC · эксперимент: Discord TCP 2, discord.media TCP 2, Discord UDP 2
# Пулы разделены по группам трафика: у каждого свой circular со своим key=.
# У TCP-пулов есть inseq= под ожидаемый объём входящего трафика; UDP его не использует.
#
# Сгенерировано build-nfqws-strategies.py — правьте генератор, а не этот файл.

# Интерфейс провайдера. Панель подставляет реальный при применении.
ISP_INTERFACE="eth3"

